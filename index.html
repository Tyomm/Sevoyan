<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEVOYAN Luxury</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<header>

<div class="logo">
<h1>SEVOYAN</h1>
</div>

<nav>
<a id="home" href="#">Գլխավոր</a>
<a id="shop" href="#shop-section">Խանութ</a>
<a id="collections" href="#">Հավաքածուներ</a>
<a id="about" href="#">Մեր մասին</a>
<a id="contact" href="#">Կապ</a>
</nav>

<div class="right-menu">

<div class="language">
<select id="language-select" onchange="changeLanguage(this.value)">
<option value="hy">🇦🇲 Հայերեն</option>
<option value="en">🇬🇧 English</option>
</select>
</div>

<a href="cart.html" class="cart">
🛒 <span id="cart-count">0</span>
</a>

</div>

</header>
<section class="search-box">

<input
type="text"
id="searchInput"
placeholder="🔍 Որոնել ապրանք..."
onkeyup="searchProducts()">

</section>
<section class="hero">

<div class="hero-content">

<h3 id="title">ՆՈՐ ՀԱՎԱՔԱԾՈՒ</h3>

<h1 id="subtitle">Հագի՛ր Քո Վստահությունը</h1>

<button id="shopBtn">Գնել հիմա</button>

</div>

</section>

<section id="shop-section" class="products">

<div class="product">
<div class="favorite" onclick="toggleFavorite(this)">♡</div>
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600">

<h3 id="product1">Շքեղ Սպորտային Կոշիկներ</h3>

<p>$249</p>

<button id="btn1">Ավելացնել զամբյուղ</button>

</div>

<div class="product">
<div class="favorite" onclick="toggleFavorite(this)">♡</div>
<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600">

<h3 id="product2">Պրեմիում Շապիկ</h3>

<p>$189</p>

<button id="btn2">Ավելացնել զամբյուղ</button>

</div>

<div class="product">
<div class="favorite" onclick="toggleFavorite(this)">♡</div>
<img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600">

<h3 id="product3">Շքեղ Պայուսակ</h3>

<p>$890</p>

<button id="btn3">Ավելացնել զամբյուղ</button>

</div>

</section>

<footer>

<p>© 2026 SEVOYAN. Բոլոր իրավունքները պաշտպանված են։</p>

</footer>

<script src="script.js"></script>

</body>
</html>
