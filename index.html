
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEVOYAN Luxury</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#000;
color:white;
text-align:center;
}

header{
padding:25px;
font-size:32px;
font-weight:bold;
border-bottom:1px solid #333;
}

nav{
margin-top:15px;
}

nav a{
color:white;
text-decoration:none;
margin:0 20px;
font-size:20px;
font-weight:bold;
}

nav a:hover{
color:gold;
}

.hero{
padding:100px 20px;
}

.hero h1{
font-size:60px;
margin:0;
}

.hero p{
font-size:24px;
color:#bbb;
}

button{
padding:15px 35px;
font-size:18px;
background:gold;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:30px;
}

button:hover{
background:white;
}

.products{
display:flex;
justify-content:center;
gap:30px;
padding:60px 20px;
flex-wrap:wrap;
}

.product{
background:#111;
border:1px solid #333;
border-radius:12px;
padding:20px;
width:220px;
transition:0.3s;
}

.product:hover{
transform:translateY(-10px);
border-color:gold;
}

.product img{
width:100%;
height:220px;
object-fit:cover;
border-radius:10px;
}

.product h2{
margin:15px 0 10px;
}

.product p{
color:gold;
font-size:22px;
font-weight:bold;
}

footer{
padding:30px;
color:#777;
}
</style>

</head>

<body>

<header>
SEVOYAN

<nav>
<a href="#">Home</a>
<a href="#">Shop</a>
<a href="#">Collections</a>
<a href="#">About</a>
<a href="#">Contact</a>
</nav>

</header>

<section class="hero">

<h1>Luxury Fashion</h1>

<p>Premium Clothing & Accessories</p>

<button>Shop Now</button>

</section>

<section class="products">

<div class="product">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" alt="Nike Shoes">
<h2>Nike Shoes</h2>
<p>$199</p>
<button>Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400" alt="Gucci T-Shirt">
<h2>Gucci T-Shirt</h2>
<p>$350</p>
<button>Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=400" alt="Louis Vuitton Bag">
<h2>Louis Vuitton Bag</h2>
<p>$1200</p>
<button>Add to Cart</button>
</div>

</section>

<footer>
© 2026 SEVOYAN. All Rights Reserved.
</footer>

</body>
</html>
