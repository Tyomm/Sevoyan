<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEVOYAN Luxury</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <div class="logo">
        <h1>SEVOYAN</h1>
    </div>

    <nav>
        <a id="home" href="#">Գլխավոր</a>
        <a id="shop" href="#">Խանութ</a>
        <a id="collections" href="#">Հավաքածուներ</a>
        <a id="about" href="#">Մեր մասին</a>
        <a id="contact" href="#">Կապ</a>
    </nav>

    <div class="language">
        <select onchange="changeLanguage(this.value)">
            <option value="hy">🇦🇲 Հայերեն</option>
            <option value="en">🇬🇧 English</option>
        </select>
    </div>

    <div class="cart">
        🛒 <span id="cart-count">0</span>
    </div>
</header>

<section class="hero">
    <div class="hero-content">
        <h2 id="title">ՆՈՐ ՀԱՎԱՔԱԾՈՒ</h2>
        <p id="subtitle">Հագի՛ր Քո Վստահությունը</p>
        <button id="shopBtn">Գնել հիմա</button>
    </div>
</section>

<section class="products">

    <div class="product">
         <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Sneakers">

    <h3 id="product1">Շքեղ Սպորտային Կոշիկներ</h3>

    <p>$249</p>

    <button id="btn1">Ավելացնել զամբյուղ</button>
    </div>

    <div class="product">
           <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500" alt="T-Shirt">

    <h3 id="product2">Պրեմիում Շապիկ</h3>

    <p>$189</p>

    <button id="btn2">Ավելացնել զամբյուղ</button>
    </div>

    <div class="product">
         <img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500" alt="Bag">

    <h3 id="product3">Շքեղ Պայուսակ</h3>

    <p>$890</p>

    <button id="btn3">Ավելացնել զամբյուղ</button>
    </div>

</section>

<footer>
    <p>© 2026 SEVOYAN. Բոլոր իրավունքները պաշտպանված են։</p>
</footer>

<script src="script.js"></script>

</body>
</html>
